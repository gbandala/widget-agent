# widget.clariifica.com — Serena (producción). F3 del plan de migración (clarifica-os).
# La imagen la construye el job build-and-push existente (buildx + build-args NEXT_PUBLIC_*);
# kamal deploy corre con -P (skip build/push) y solo hace el rolling deploy.
# Env runtime: /etc/widget-agent.env en el VPS (paridad con el deploy anterior —
# la migración de env a GH Secrets queda como paso posterior, ver bitácora).

service: widget-agent
image: gbandala/widget-agent

# Host vía ERB desde env (repo público — la IP del tailnet no se commitea)
servers:
  web:
    hosts:
      - <%= ENV["VPS_HOST"] %>
    proxy: false
    options:
      network: dokploy-network
      env-file: /etc/widget-agent.env

env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    # Docker fija HOSTNAME al hostname del contenedor, que /etc/hosts resuelve
    # a una IP distinta por cada red conectada (dokploy-network + kamal). El
    # server.js standalone de Next hace bind solo a la primera que resuelve
    # (la red kamal), dejando el puerto sordo para Traefik (dokploy-network) ->
    # 502 permanente. 0.0.0.0 fuerza bind en todas las interfaces.
    HOSTNAME: "0.0.0.0"

labels:
  traefik.enable: true
  traefik.http.routers.widget-agent.rule: Host(`widget.clariifica.com`)
  traefik.http.routers.widget-agent.entrypoints: websecure
  traefik.http.routers.widget-agent.tls.certresolver: letsencrypt
  traefik.http.services.widget-agent.loadbalancer.server.port: 3000

registry:
  server: ghcr.io
  username: gbandala
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile

ssh:
  user: gabriel
  keys:
    - ~/.ssh/id_ed25519
