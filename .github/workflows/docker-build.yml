name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. Pre-deploy: unit tests + lint ─────────────────────────────────────
  pre-deploy:
    name: Pre-deploy (unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  # ── 2. Build & push Docker image ─────────────────────────────────────────
  build-and-push:
    name: Build & push image
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DEMO_WIDGET_TOKEN=${{ secrets.NEXT_PUBLIC_DEMO_WIDGET_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop widget-agent 2>/dev/null || true
            docker rm   widget-agent 2>/dev/null || true
            docker run -d \
              --name widget-agent \
              --restart unless-stopped \
              --network dokploy-network \
              -e NODE_ENV=production \
              -e PORT=3000 \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.widget-agent.rule=Host(\`widget.clariifica.com\`)" \
              --label "traefik.http.routers.widget-agent.entrypoints=websecure" \
              --label "traefik.http.routers.widget-agent.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.widget-agent.loadbalancer.server.port=3000" \
              --env-file /etc/widget-agent.env \
              ghcr.io/${{ github.repository }}:latest

  # ── 4. Post-deploy: smoke tests contra producción ────────────────────────
  post-deploy:
    name: Post-deploy (API smoke tests)
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for VPS ready
        run: |
          for i in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://widget.clariifica.com/api/widget/chat)
            if [ "$status" = "405" ]; then
              echo "VPS ready after $((i * 10))s (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i/18: HTTP $status — retrying in 10s..."
            sleep 10
          done
          echo "VPS not ready after 3 minutes"
          exit 1

      - name: API smoke tests
        env:
          WIDGET_TEST_TOKEN: ${{ secrets.WIDGET_TEST_TOKEN }}
          WIDGET_TEST_ORIGIN: clariifica.com
          WIDGET_BASE_URL: https://widget.clariifica.com
        run: pnpm test:api
