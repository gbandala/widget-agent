name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DEMO_WIDGET_TOKEN=${{ secrets.NEXT_PUBLIC_DEMO_WIDGET_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop widget-agent 2>/dev/null || true
            docker rm   widget-agent 2>/dev/null || true
            docker run -d \
              --name widget-agent \
              --restart unless-stopped \
              --network dokploy-network \
              -e NODE_ENV=production \
              -e PORT=3000 \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.widget-agent.rule=Host(\`widget.clariifica.com\`)" \
              --label "traefik.http.routers.widget-agent.entrypoints=websecure" \
              --label "traefik.http.routers.widget-agent.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.widget-agent.loadbalancer.server.port=3000" \
              --env-file /etc/widget-agent.env \
              ghcr.io/${{ github.repository }}:latest
