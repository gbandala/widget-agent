name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: 'deploy o rollback'
        type: choice
        options: [deploy, rollback]
        default: deploy
      version:
        description: 'Versión (sha) — obligatoria en rollback'
        type: string
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. Pre-deploy: unit tests + lint ─────────────────────────────────────
  pre-deploy:
    name: Pre-deploy (unit tests + lint)
    if: ${{ inputs.command != 'rollback' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  # ── 2. Build & push Docker image ─────────────────────────────────────────
  build-and-push:
    name: Build & push image
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DEMO_WIDGET_TOKEN=${{ secrets.NEXT_PUBLIC_DEMO_WIDGET_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to VPS (Kamal — F3 migración 2026-07-15; antes: bash stop/rm/run) ──
  deploy:
    name: Deploy to VPS (Kamal)
    needs: build-and-push
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    uses: gbandala/clarifica-os/.github/workflows/deploy-kamal.yml@main
    secrets: inherit
    with:
      run: |
        set -euo pipefail
        CMD="${{ inputs.command || 'deploy' }}"
        VER="${{ inputs.version }}"
        if [ "$CMD" = "deploy" ]; then
          # -P: la imagen ya la construyó y pusheó el job build-and-push
          kamal deploy -c kamal/deploy.widget.yml --version "${VER:-${{ github.sha }}}" -P
        else
          test -n "$VER" || { echo "rollback requiere version"; exit 1; }
          kamal rollback "$VER" -c kamal/deploy.widget.yml
        fi
        echo "== validación =="
        ssh gabriel@100.82.132.9 '
          docker ps --filter label=service=widget-agent --format "{{.Names}} ({{.Status}})"
          CID=$(docker ps -q --filter label=service=widget-agent | head -1)
          docker exec $CID sh -c "wget -qO- -T 10 http://localhost:3000/ >/dev/null" && echo "HTTP interno OK"
          curl -s -o /dev/null -w "público -> %{http_code}\n" https://widget.clariifica.com
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://widget.clariifica.com/api/widget/session -H "Content-Type: application/json" -d "{}")
          echo "API session sin token -> $code (401 esperado = runtime OK)"
          test "$code" = "401"
        '

